<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHAM | Bird's Eye Life View</title>
    <style>
        :root {
            --bg-void-start: #0a0e1a;
            --bg-void-end: #03050a;
            --card-slate: rgba(16, 22, 42, 0.7);
            --border-profile: rgba(255, 255, 255, 0.06);
            --accent-pink: #f472b6;
            --accent-blue: #60a5fa;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, var(--bg-void-start), var(--bg-void-end));
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .aurora-leak {
            position: absolute; width: 450px; height: 450px; border-radius: 50%;
            filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: 0;
        }
        .aurora-leak.pink { top: -10%; left: -5%; background: var(--accent-pink); }

        .timeline-container {
            width: 100%;
            max-width: 600px;
            z-index: 1;
            position: relative;
        }

        .global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-profile);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-profile);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background: var(--accent-pink);
            color: white;
            border-color: var(--accent-pink);
        }
    </style>
</head>
<body>

    <div class="aurora-leak pink"></div>

    <div class="timeline-container">
        
        <header class="global-header">
            <div>
                <span class="logo-text">🦅 BIRD'S EYE VIEW</span>
                <p class="subtitle">A high-level timeline of your journey through life.</p>
            </div>
            <a href="index.html" onclick="window.location.href='index.html'; return false;" class="btn-back">
                ← Dashboard
            </a>
        </header>

        <div id="timeline-stream-wrapper">
            </div>

        <div id="infinite-scroll-sentinel" style="height: 30px; margin-top: 20px; display: flex; justify-content: center; align-items: center;">
            <span id="sentinel-loader-text" style="font-size: 0.85rem; color: var(--text-dim); display: none; font-style: italic;">
                Streaming older diary entries...
            </span>
        </div>

    </div>

    <script src="birds-eye.js" type="module"></script>
</body>
</html>
